<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <title th:text="'Client groups - Cold Mail'">Client groups</title>
  <link rel="icon" th:href="@{/assets/img/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/layout :: shell(~{::main}, 'client-groups', 'Client groups')}">
    <main th:fragment="main" class="page">

      <header class="page-head">
        <div>
          <h1 class="page-title">Client groups</h1>
          <p class="page-sub">Segments you can target with a campaign, such as a region or a product line.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" data-action="create">
            <svg class="nav-icon" aria-hidden="true"><use href="#i-plus"></use></svg>
            <span>Add group</span>
          </button>
        </div>
      </header>

      <section class="panel">
        <div class="toolbar">
          <div class="toolbar-search">
            <label class="sr-only" for="group-search">Search groups</label>
            <input class="input input-sm" type="search" id="group-search" data-role="search"
                   placeholder="Search by code or name" autocomplete="off">
          </div>
          <p class="toolbar-meta" data-role="summary"></p>
        </div>

        <div class="table-wrap">
          <table class="table" data-role="table">
            <caption class="sr-only">Client groups</caption>
            <thead>
              <tr>
                <th scope="col">Code</th>
                <th scope="col">Name</th>
                <th scope="col" class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody data-role="rows"></tbody>
          </table>

          <div class="empty-state" data-role="empty" hidden>
            <svg class="empty-mark" aria-hidden="true"><use href="#i-layers"></use></svg>
            <p class="empty-title">No groups yet</p>
            <p class="empty-text">Create a group to send one campaign to a defined set of clients.</p>
            <div class="empty-actions">
              <button class="btn btn-primary" type="button" data-action="create">Add a group</button>
            </div>
          </div>
        </div>

        <div th:replace="~{fragments/pagination :: pager('groups-pager')}"></div>
      </section>

      <dialog class="modal" id="group-dialog" data-role="dialog" aria-labelledby="group-dialog-title">
        <form data-role="form" novalidate>
          <div class="modal-head">
            <h2 class="modal-title" id="group-dialog-title" data-role="title">Add group</h2>
            <button class="modal-close" type="button" data-action="close" aria-label="Close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="alert alert-danger modal-error" data-role="error" role="alert" hidden></div>

            <div class="field">
              <label class="field-label" for="group-code">Code <span class="req" aria-hidden="true">*</span></label>
              <input class="input" type="text" id="group-code" name="code" maxlength="32" required
                     autocapitalize="characters" spellcheck="false">
              <p class="hint">A short, stable code a campaign can target. Letters and digits only.</p>
            </div>

            <div class="field">
              <label class="field-label" for="group-name">Name <span class="req" aria-hidden="true">*</span></label>
              <input class="input" type="text" id="group-name" name="name" maxlength="255" required>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-secondary" type="button" data-action="close">Cancel</button>
            <button class="btn btn-primary" type="submit" data-role="submit">Save group</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>
  <script type="module" th:src="@{/assets/js/client-groups.js}"></script>
</body>
</html>
