<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Application shell</title>
</head>
<body>
<!--/*
  The shared application shell.

  Parameters
    content - the page body, passed as ~{::main}
    nav     - the key of the active navigation entry
    title   - the label shown in the top bar

  The signed-in username comes from the model attribute "signedInUsername"
  when the page controller supplies one, and from the security context in
  the session otherwise. When neither is there the top bar falls back to a
  neutral label instead of failing the page.
*/-->
<div th:fragment="shell(content, nav, title)" class="app-shell">

  <meta name="_csrf" th:content="${_csrf.token}">

  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M2.5 20v-1a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v1"/><path d="M16.5 5.2a3.5 3.5 0 0 1 0 6.6"/><path d="M18 15.2A4 4 0 0 1 21.5 19v1"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m9 11 3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><path d="M4 5h16v6H4zM4 13h16v6H4z"/><path d="M8 8h.01M8 16h.01"/></symbol>
    <symbol id="i-at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.6 7.2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.5 18-4-8-8-4L21 3Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13h5l1.5 3h3L15 13h5"/><path d="M4 13 6.5 5h11L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m14 6 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-1.4 5.6"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V8"/><path d="m7 13 5-5 5 5"/><path d="M4 4h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m4 6 8 6 8-6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17h.01"/></symbol>
  </svg>

  <aside class="sidebar">
    <a class="brand" th:href="@{/dashboard}">
      <img class="brand-mark" th:src="@{/assets/img/logo.svg}" alt="" width="30" height="30">
      <span class="brand-name">Cold Mail</span>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <p class="nav-group">Overview</p>
      <a class="nav-link" th:href="@{/dashboard}" th:classappend="${nav == 'dashboard'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'dashboard' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-dashboard"></use></svg>
        <span>Dashboard</span>
      </a>

      <p class="nav-group">Audience</p>
      <a class="nav-link" th:href="@{/clients}" th:classappend="${nav == 'clients'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'clients' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-users"></use></svg>
        <span>Clients</span>
      </a>
      <a class="nav-link" th:href="@{/groups}" th:classappend="${nav == 'client-groups'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'client-groups' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-layers"></use></svg>
        <span>Client groups</span>
      </a>

      <p class="nav-group">Content</p>
      <a class="nav-link" th:href="@{/templates}" th:classappend="${nav == 'templates'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'templates' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-file"></use></svg>
        <span>Email templates</span>
      </a>
      <a class="nav-link" th:href="@{/templates/approvals}" th:classappend="${nav == 'template-approvals'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'template-approvals' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-check"></use></svg>
        <span>Approvals</span>
      </a>

      <p class="nav-group">Sending</p>
      <a class="nav-link" th:href="@{/accounts/smtp}" th:classappend="${nav == 'smtp-accounts'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'smtp-accounts' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-server"></use></svg>
        <span>SMTP accounts</span>
      </a>
      <a class="nav-link" th:href="@{/accounts/gmail}" th:classappend="${nav == 'gmail-accounts'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'gmail-accounts' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-at"></use></svg>
        <span>Gmail accounts</span>
      </a>
      <a class="nav-link" th:href="@{/campaigns}" th:classappend="${nav == 'campaigns'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'campaigns' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-send"></use></svg>
        <span>Campaigns</span>
      </a>
      <a class="nav-link" th:href="@{/outbox}" th:classappend="${nav == 'outbox'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'outbox' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-clock"></use></svg>
        <span>Outbox</span>
      </a>

      <p class="nav-group">Intelligence</p>
      <a class="nav-link" th:href="@{/extraction}" th:classappend="${nav == 'extraction'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'extraction' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-download"></use></svg>
        <span>Extraction</span>
      </a>
      <a class="nav-link" th:href="@{/inbox}" th:classappend="${nav == 'inbox'} ? 'is-active' : ''" th:attr="aria-current=${nav == 'inbox' ? 'page' : null}">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-inbox"></use></svg>
        <span>Inbox</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      Cold Mail - self hosted lead generation.
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <span class="topbar-title" th:text="${title}">Overview</span>
      <span class="topbar-spacer"></span>
      <div class="topbar-user">
        <!--/*
          The signed-in username. The model attribute wins when the page
          controller supplies one. Otherwise it is read from the security
          context Spring Security keeps in the session, so the top bar works
          without the controller having to know about it. Every step of the
          chain is null checked, so a missing session only costs the name.
        */-->
        <span class="topbar-username"
              th:text="${signedInUsername != null ? signedInUsername : (session != null and session.SPRING_SECURITY_CONTEXT != null and session.SPRING_SECURITY_CONTEXT.authentication != null ? session.SPRING_SECURITY_CONTEXT.authentication.name : 'Signed in')}">Signed in</span>
        <form th:action="@{/logout}" method="post" class="btn-row">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
        </form>
      </div>
    </header>

    <div class="content" id="main-content" th:insert="${content}"></div>
  </div>

  <div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>
</div>
</body>
</html>
