name: CodeQL

# Static analysis of the whole repository: the application, the sidecar and the workflows
# that build them. The findings land in the repository's security tab.
#
# Each language is analysed on its own runner. The extractors are memory hungry, and
# running several of them in one job is what made an early run fall over while it
# finalised the database.
#
# Every language is analysed here rather than by GitHub's default setup. The two are
# mutually exclusive: a repository cannot have both, and the default setup cannot be
# read or reviewed in the repository. Having the analysis in the repository means a
# contributor can see exactly what is checked and how.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so that a new query catches something the old build missed.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # The java extractor does not need the project to be built. The analysis works on
          # the source, so the workflow does not have to build the application first.
          build-mode: none
      - name: Perform the analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
