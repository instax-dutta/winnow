name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,help wanted
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has been quiet for a while. It is marked as stale so that the
            backlog stays readable. It is not closed. Add a comment and it comes back.
          stale-pr-message: >
            This pull request has been quiet for a while. If it is still wanted, add a
            comment and it comes back.
