name: Release

# A tag produces a release: the jar, a checksum file, a container image, a software
# bill of materials, a build provenance attestation and a signed GitHub release.
#
# Nothing is published that has not passed the full gate ledger on the same commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"
      - name: Build and test
        run: ./mvnw -B -Dmaven.repo.local=${{ runner.temp }}/.m2 verify
      - name: Package
        run: ./mvnw -B -Dmaven.repo.local=${{ runner.temp }}/.m2 -DskipTests package
      - name: Check the source for credential-shaped literals
        run: node tools/verify/no-secrets.mjs
      - name: Stage the release artifacts
        run: |
          # The artifacts are staged in one directory so the upload action has a single
          # unambiguous path to work with.
          rm -rf dist
          mkdir -p dist
          cp target/seo-*.jar dist/ 2>/dev/null || true
          rm -f dist/*.jar.original
          cd dist
          sha256sum ./*.jar > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - name: Upload the release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the dependency list
        run: |
          ./mvnw -B -Dmaven.repo.local=${{ runner.temp }}/.m2 dependency:list \
            -DoutputFile=target/dependencies.txt -DincludeScope=runtime
          cat target/dependencies.txt
      - name: Write the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/dependencies.txt
          sbom-path: target/dependencies.txt

  image:
    name: Container image
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ inputs.version == '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    needs: [build, sbom, image]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: target
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/seo-*.jar
      - name: Create the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            dist/*.jar
            dist/SHA256SUMS
          body: |
            ## ${{ needs.build.outputs.version }}

            A self-hosted cold mail and lead generation platform.

            - The jar: `seo-*.jar`
            - The checksums: `SHA256SUMS`
            - The container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}`

            The build is attested. Verify it with:

            ```
            gh attestation verify seo-*.jar --repo ${{ github.repository }}
            ```

            Every claim in the release notes is checked by the gate ledger in `GATES.md`.
