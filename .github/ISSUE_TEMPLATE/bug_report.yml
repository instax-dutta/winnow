name: Bug report
description: Something does not work the way it is supposed to
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. If this is a security problem, do not use this form.
        See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
      placeholder: The dashboard shows 0 clients even though I uploaded 12.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - docker compose
        - the jar, with an external database
        - a build from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The lines around the problem, with anything secret removed.
      render: shell
    validations:
      required: false
